name: PyPI release

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('BUILD-ONLY release validation from {0}', github.ref_name)
      || format('Production release validation for {0}', github.ref_name) }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build and verify distributions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      publish_allowed: ${{ steps.preflight.outputs.publish_allowed }}
      expected_version: ${{ steps.preflight.outputs.expected_version }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out invoked source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Fetch protected main history
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Run release preflight
        id: preflight
        run: >-
          python scripts/release_preflight.py preflight
          --event-name "${{ github.event_name }}"
          --ref "${{ github.ref }}"
          --sha "${{ github.sha }}"
          --main-ref origin/main
          --github-output "$GITHUB_OUTPUT"
      - name: Install build validation tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution once
        run: python -m build --outdir dist
      - name: Audit distribution contents
        run: python tests/distribution_contents_test.py dist/*.whl dist/*.tar.gz
      - name: Validate metadata, artifact set, and hashes
        run: >-
          python scripts/release_preflight.py artifacts
          --directory dist
          --expected-version "${{ steps.preflight.outputs.expected_version }}"
          --github-step-summary "$GITHUB_STEP_SUMMARY"
      - name: Check package metadata rendering
        run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Smoke-test clean wheel installation outside checkout
        run: |
          python -m venv /tmp/matmul-inspector-release-wheel
          /tmp/matmul-inspector-release-wheel/bin/python -m pip install --no-deps dist/*.whl
          python tests/installed_package_smoke.py \
            --python /tmp/matmul-inspector-release-wheel/bin/python \
            --command /tmp/matmul-inspector-release-wheel/bin/matmul-inspector \
            --alias /tmp/matmul-inspector-release-wheel/bin/matmul-inspector-python
      - name: Smoke-test clean source distribution installation outside checkout
        run: |
          python -m venv /tmp/matmul-inspector-release-sdist
          /tmp/matmul-inspector-release-sdist/bin/python -m pip install --no-deps dist/*.tar.gz
          python tests/installed_package_smoke.py \
            --python /tmp/matmul-inspector-release-sdist/bin/python \
            --command /tmp/matmul-inspector-release-sdist/bin/matmul-inspector \
            --alias /tmp/matmul-inspector-release-sdist/bin/matmul-inspector-python
      - name: Upload validated build-only artifacts
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish validated distributions to PyPI
    needs: build-and-verify
    if: >-
      needs.build-and-verify.result == 'success'
      && needs.build-and-verify.outputs.publish_allowed == 'true'
      && github.event_name == 'push'
      && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/matmul-inspector/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download exact validated artifacts from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build-and-verify.outputs.artifact_id }}
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
