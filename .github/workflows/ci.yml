name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure CPU-only
        run: >-
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_FLAGS=-Werror
          -DMATMUL_INSPECTOR_ENABLE_CUDA=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build -L cpu --output-on-failure
      - name: Exercise result capture without a GPU
        run: >-
          ./build/matmul-inspector compare --reference cpu --candidate cpu
          --sizes 4,17 --seed 42 --output results/ci-smoke
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cpu-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: |
            results/ci-smoke/
            build/Testing/Temporary/LastTest.log

  cuda-compile:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.6.3-devel-ubuntu22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake g++ git python3 ca-certificates
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure CUDA compilation without hardware tests
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DMATMUL_INSPECTOR_ENABLE_CUDA=ON -DMATMUL_INSPECTOR_GPU_TESTS=OFF
      - name: Require the CUDA target and build everything
        run: |
          cmake --build build --target cuda_matmul --parallel 2
          cmake --build build --parallel 2
      - name: Inspect controlled FP32 instructions (no GPU required)
        run: python3 scripts/verify_fp.py --binary build/libcuda_matmul.a --report build/fp_verification.json
      - name: Run CPU tests only
        run: ctest --test-dir build -L cpu --output-on-failure
